<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكوبي | متجر جادجتات وإكسسوارات (نسخة تجريبية)</title>
<meta name="description" content="الكوبي: واجهة متجر جادجتات وإكسسوارات بالعربية تجريبية. تصفح، ابحث، أضف للسلة وأرسل طلبك على واتساب.">
<meta name="theme-color" content="#0b0b0d">
<link rel="canonical" href="https://faresdief.github.io/EL_Coby/">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:url" content="https://faresdief.github.io/EL_Coby/">
<meta property="og:title" content="الكوبي | متجر جادجتات وإكسسوارات (نسخة تجريبية)">
<meta property="og:description" content="واجهة متجر جادجتات وإكسسوارات بالعربية مع سلة وطلب عبر واتساب.">
<meta property="og:locale" content="ar_EG">
<meta property="og:image" content="https://faresdief.github.io/EL_Coby/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="shop.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"الكوبي","url":"https://faresdief.github.io/EL_Coby/","inLanguage":"ar"}</script>
</head>
<body>
<header class="top">
  <a class="logo" href="#" id="logo">الكوبي</a>
  <button class="cartbtn" id="openCart" aria-label="فتح السلة">السلة <b id="count">0</b></button>
</header>
<div class="sample" id="sampleBar" hidden></div>
<main>
  <section class="hero">
    <p class="eyebrow">مجموعة الجادجتات</p>
    <h1 id="brand">الكوبي</h1>
    <p id="tagline" class="tag"></p>
    <a class="cta" href="#shop">تصفح المنتجات</a>
  </section>
  <section id="shop" class="shop">
    <div class="tools">
      <input id="q" type="search" placeholder="ابحث عن منتج..." aria-label="بحث">
      <select id="sort" aria-label="ترتيب">
        <option value="">الترتيب الافتراضي</option>
        <option value="asc">السعر: الأقل أولًا</option>
        <option value="desc">السعر: الأعلى أولًا</option>
      </select>
    </div>
    <div class="chips" id="chips" role="group" aria-label="التصنيفات"></div>
    <p id="empty" class="empty" hidden>مفيش منتجات مطابقة للبحث.</p>
    <div class="grid" id="grid"></div>
  </section>
</main>
<footer class="foot"><p id="footNote"></p></footer>

<div class="shade" id="shade" hidden></div>
<aside class="drawer" id="drawer" aria-label="السلة" aria-hidden="true">
  <div class="dhead"><h2>سلتك</h2><button id="closeCart" aria-label="إغلاق">✕</button></div>
  <div id="items" class="items"></div>
  <div class="dfoot">
    <label>اسمك (اختياري)<input id="cname" autocomplete="name"></label>
    <div class="total"><span>الإجمالي</span><b id="total">0</b></div>
    <a class="wa" id="wa" href="#" target="_blank" rel="noopener">اطلب عبر واتساب</a>
    <p class="small">يفتح واتساب برسالة جاهزة. لا يتم إرسال شيء تلقائيًا. الشحن والدفع يُتفق عليهما في المحادثة.</p>
  </div>
</aside>
<script src="shop.js"></script>
</body>
</html>
