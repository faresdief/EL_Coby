<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكوبي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script>
/* يضبط اللغة والوضع قبل الرسم عشان ما يحصلش وميض */
window.S={g:k=>{try{return localStorage.getItem(k)}catch(e){}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
(()=>{const d=document.documentElement,l=S.g('lang')||'ar',t=S.g('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');d.lang=l;d.dir=l=='ar'?'rtl':'ltr';d.dataset.theme=t})();
</script>
<style>
:root{--bg:#fcfbf9;--bg2:#eae6df;--tile:#f2eee4;--fg:#1c1b18;--mute:#78725f;--line:#e2ddce;--acc:#c59b27;--afg:#1c1b18;--r:16px;--font:'Poppins','Cairo',sans-serif;
--shadow:0 10px 28px -12px rgba(28,27,24,.22),0 2px 8px -3px rgba(28,27,24,.14);--shadow-sm:0 4px 12px -5px rgba(28,27,24,.18)}
/* الـ tile فاتح في الوضعين عشان صور المنتجات تفضل واضحة */
:root[data-theme=dark]{--bg:#121212;--bg2:#2a2a2a;--tile:#d9d3c2;--fg:#f5f5f5;--mute:#a39d8f;--line:#3a3a3a;--acc:#d4af37;--afg:#161616;
--shadow:0 12px 30px -10px rgba(0,0,0,.6),0 3px 10px -3px rgba(0,0,0,.45);--shadow-sm:0 4px 14px -5px rgba(0,0,0,.5)}
:root[lang=ar]{--font:'Cairo','Poppins',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--fg);line-height:1.6}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1200px;margin-inline:auto;padding-inline:20px}
.top{background:var(--fg);color:var(--bg);text-align:center;font-size:.8rem;padding:6px}
.hd{position:sticky;top:var(--bar-h,0px);z-index:9;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transform:translateZ(0);will-change:transform}
.hd-in{display:flex;align-items:center;gap:14px;min-height:66px}
.logo{font-weight:700;font-size:1.5rem;letter-spacing:-.5px}.logo b{color:var(--acc)}:root[lang=ar] .logo{letter-spacing:0}
nav{display:flex;gap:22px;font-size:.9rem;margin-inline-end:auto}nav a{color:var(--mute);transition:color .2s}nav a:hover{color:var(--acc)}
.search{position:relative;width:230px}
.search input{width:100%;height:38px;border:1px solid var(--line);border-radius:99px;background:var(--bg2);padding-inline:38px 14px;outline:0;transition:border-color .2s}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;inset-inline-start:12px;top:10px;color:var(--mute);width:18px;height:18px}
.ic{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;transition:background .2s}.ic:hover{background:var(--bg2)}
.lang{font-size:.8rem;font-weight:600;border:1px solid var(--line);border-radius:99px;padding:4px 12px}
.cnt{position:absolute;top:0;inset-inline-end:0;min-width:17px;height:17px;border-radius:9px;background:var(--acc);color:var(--afg);font-size:.68rem;font-weight:700;display:grid;place-items:center}
.to-l{display:none}[data-theme=dark] .to-l{display:block}[data-theme=dark] .to-d{display:none}
.hero{display:grid;grid-template-columns:1.1fr 1fr;align-items:center;margin-block:28px;background:var(--bg2);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.hero-t{padding:48px}
h1{font-size:clamp(2rem,5vw,3.6rem);line-height:1.2;margin-bottom:12px}
.hero-t p{color:var(--mute);margin-bottom:26px;font-size:1.1rem}
.btn{display:inline-block;background:var(--fg);color:var(--bg);padding:12px 34px;border-radius:99px;font-weight:600;box-shadow:var(--shadow-sm);transition:transform .2s,background .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.gold{background:var(--acc);color:var(--afg)}.btn.gold:hover{filter:brightness(1.08)}
.hero-a{position:relative;align-self:stretch;min-height:360px;background:var(--tile)}
.hero-a img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-block:48px}
.val{display:flex;gap:14px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.val svg{width:30px;height:30px;color:var(--acc);flex:none}.val b{display:block;font-weight:600}.val span{font-size:.85rem;color:var(--mute)}
.sec{margin-block:64px}.sec-h{text-align:center;margin-bottom:26px}.sec-h h2{font-size:1.8rem}.sec-h p{color:var(--mute)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:28px}
.tab{border:1px solid var(--line);border-radius:99px;padding:6px 18px;font-size:.88rem;transition:.2s}.tab.on,.tab:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}
.tile{position:relative;background:var(--tile);border-radius:var(--r);aspect-ratio:1;display:grid;place-items:center;overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow .25s,transform .25s}
.card:hover .tile{box-shadow:var(--shadow);transform:translateY(-4px)}
.pic{position:absolute;inset:0}.pic img,.mm img{width:100%;height:100%;object-fit:cover;transition:transform .5s}.card:hover .pic img{transform:scale(1.07)}
.pic .ct,.mm .ct,.th .ct{object-fit:contain;background:#fff}
.badge{position:absolute;top:10px;inset-inline-start:10px;background:var(--acc);color:var(--afg);font-size:.72rem;font-weight:700;padding:2px 10px;border-radius:99px;pointer-events:none}
.badge.new{background:var(--fg);color:var(--bg)}
.fav{position:absolute;top:8px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;background:var(--bg);color:var(--fg);box-shadow:var(--shadow-sm);display:grid;place-items:center}
.fav.on svg{fill:#e5384f;stroke:#e5384f}
.add{position:absolute;inset-inline:10px;bottom:10px;background:var(--fg);color:var(--bg);box-shadow:var(--shadow-sm);border-radius:10px;padding:9px;font-size:.88rem;opacity:0;transform:translateY(8px);transition:.25s}
.card:hover .add,.add:focus-visible{opacity:1;transform:none}
@media(hover:none){.add{opacity:1;transform:none}}
.nm{text-align:start;transition:color .2s}.nm:hover{color:var(--acc)}
.card h3{font-size:.95rem;font-weight:600;margin-top:12px}.price{display:flex;gap:8px;align-items:baseline}.price s{color:var(--mute);font-size:.82rem}
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.rev{background:var(--bg2);border-radius:var(--r);padding:24px;box-shadow:var(--shadow-sm)}
.stars{color:#f5a623;letter-spacing:2px}.rev p{margin:10px 0 14px}.rev small{color:var(--mute)}
/* FAQ */
.faq{max-width:760px;margin-inline:auto;display:flex;flex-direction:column;gap:10px}
.faq-it{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg2)}
.faq-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;font-weight:600;text-align:start}
.faq-q svg{transition:transform .3s;flex:none;color:var(--acc)}
.faq-it.open .faq-q svg{transform:rotate(180deg)}
.faq-it.open .faq-a{grid-template-rows:1fr}
.faq-a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.faq-a>div{overflow:hidden}
.faq-a p{color:var(--mute);font-size:.92rem;padding:0 18px 16px}
footer{border-top:1px solid var(--line);margin-top:72px;padding-block:44px;background:var(--bg2)}
.ft{display:grid;grid-template-columns:1.2fr 1fr 1fr 1.5fr;gap:28px;font-size:.9rem}
.ft h4{margin-bottom:10px}.ft a{display:block;color:var(--mute);padding-block:2px;background:none;border:0;font:inherit;text-align:start;cursor:pointer}.ft a:hover{color:var(--acc)}
.sub{display:flex;border-bottom:1px solid var(--line)}.sub input{flex:1;min-width:0;background:none;border:0;outline:0;padding:8px 0}.sub button{font-weight:600;color:var(--acc)}
.copy{text-align:center;color:var(--mute);font-size:.8rem;margin-top:30px}
/* centered modals */
.mo{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;overflow-y:auto}
.mo[hidden]{display:none}
.md{position:relative;background:var(--bg);border-radius:20px;max-width:960px;width:100%;max-height:calc(100dvh - 32px);overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:28px;padding:28px;box-shadow:var(--shadow);animation:up .25s}
.md.one{grid-template-columns:1fr;max-width:520px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
.x{position:absolute;top:12px;inset-inline-end:12px;z-index:2;background:var(--bg2)}
.mm{aspect-ratio:1;background:var(--tile);border-radius:var(--r);overflow:hidden}
.th{display:flex;gap:10px;margin-top:10px}.th button{width:66px;height:66px;border-radius:10px;overflow:hidden;border:2px solid transparent;background:var(--tile);opacity:.75;transition:.2s}.th button.on{border-color:var(--acc);opacity:1}.th img{width:100%;height:100%;object-fit:cover}
.mi h2{font-size:1.5rem;line-height:1.3;padding-inline-end:40px}
.pr{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:1.6rem;font-weight:700;margin-top:6px}.pr s{font-size:1rem;font-weight:400;color:var(--mute)}.pr .badge{position:static;font-size:.8rem}
.sv{color:var(--mute);font-size:.85rem}
.sp{list-style:none;margin:16px 0;border-block:1px solid var(--line);padding-block:8px;font-size:.9rem}.sp li{display:flex;justify-content:space-between;gap:16px;padding-block:3px}.sp span{color:var(--mute)}
.qt{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.qt div{display:flex;border:1px solid var(--line);border-radius:10px}.qt div button{width:40px;height:40px;font-size:1.2rem}.qt output{min-width:36px;display:grid;place-items:center;font-weight:600}.qt b{margin-inline-start:auto}
.act{display:grid;grid-template-columns:1fr 1fr;gap:10px}.act .btn{border-radius:12px;padding:13px 10px;text-align:center}
.pay{display:flex;gap:10px;align-items:center;margin-top:14px;padding:12px;border-radius:12px;background:var(--bg2);font-size:.85rem;color:var(--mute)}.pay svg{flex:none;color:var(--acc)}
/* auth */
.lt{display:flex;gap:6px;margin-bottom:16px;border:1px solid var(--line);border-radius:99px;padding:4px}
.lt button{flex:1;border-radius:99px;padding:8px;font-size:.85rem;font-weight:600}.lt button.on{background:var(--fg);color:var(--bg)}
.frm label{display:block;font-size:.85rem;margin-bottom:5px;color:var(--mute)}
.frm input,.frm select,.frm textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg2);margin-bottom:14px}
.frm input:focus,.frm select:focus,.frm textarea:focus{border-color:var(--acc)}
.frm textarea{resize:vertical;min-height:70px}
.err{color:#d8453a;font-size:.82rem;margin:-8px 0 12px}
.mute-sm{color:var(--mute);font-size:.78rem;margin-top:10px}
/* info modal */
.info-b{color:var(--mute);font-size:.92rem}
/* cart drawer */
.bd{position:fixed;inset:0;z-index:98;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s ease;will-change:opacity}.bd.open{opacity:1;pointer-events:auto}
.cd{position:fixed;top:0;bottom:0;right:0;width:min(420px,92vw);background:var(--bg);z-index:99;display:flex;flex-direction:column;box-shadow:var(--shadow);transform:translateX(100%);transition:transform .3s ease;will-change:transform}
html[dir="rtl"] .cd{right:auto;left:0;transform:translateX(-100%)}
.cd.open{transform:translateX(0) !important}
#fade{position:fixed;inset:0;z-index:100;opacity:0;pointer-events:none}
.cd-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}
.cd-h h3{font-size:1.2rem}
.cd-b{flex:1;overflow-y:auto;padding:6px 20px}
.ci{display:flex;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.ci img{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--tile);flex:none}
.ci-i{flex:1;min-width:0}.ci-i h4{font-size:.9rem;font-weight:600;margin-bottom:2px}
.ci-p{font-size:.85rem;color:var(--mute)}
.ci-q{display:flex;align-items:center;gap:8px;margin-top:8px}
.ci-q button{width:26px;height:26px;border:1px solid var(--line);border-radius:6px}
.ci-rm{margin-inline-start:auto;color:var(--mute)}.ci-rm:hover{color:#d8453a}
.empty{text-align:center;color:var(--mute);padding:50px 10px}
.cd-f{border-top:1px solid var(--line);padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.disc{display:flex;gap:8px}
.disc input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--bg2)}
.disc button{border:1px solid var(--line);border-radius:10px;padding:0 16px;font-weight:600;white-space:nowrap}
.tr{display:flex;justify-content:space-between;font-size:.92rem;color:var(--mute)}
.tr.tot{color:var(--fg);font-weight:700;font-size:1.15rem}
.ord{background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:6px;font-size:.88rem}
.ord div{display:flex;justify-content:space-between;padding-block:2px;gap:10px}
/* v4: toast / variants / shipping bar / cross-sell / wishlist / share */
[hidden]{display:none!important}
.tab svg{width:14px;height:14px;vertical-align:-2px;margin-inline-end:5px}
.none{grid-column:1/-1;text-align:center;color:var(--mute);padding:40px 10px}
.toasts{position:fixed;top:calc(78px + var(--bar-h,0px));inset-inline-end:16px;z-index:95;display:flex;flex-direction:column;gap:10px;width:min(340px,calc(100vw - 32px));pointer-events:none}
.ts{pointer-events:auto;display:flex;align-items:center;gap:10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-inline-start:4px solid var(--acc);padding:11px 12px;border-radius:14px;box-shadow:var(--shadow);font-size:.86rem;animation:tin .25s ease both}
.ts.out{animation:tout .25s ease both}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
.ts span{flex:1;min-width:0}
.ts .ta{background:var(--acc);color:var(--afg);border-radius:99px;padding:5px 12px;font-weight:700;font-size:.78rem;white-space:nowrap}
.ts .tx{color:var(--mute);font-size:1.25rem;line-height:1;padding:0 4px}
.vr{margin-top:14px}
.vl{display:block;font-size:.85rem;color:var(--mute);margin-bottom:8px}.vl b{color:var(--fg)}
.sws,.szs{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;background:var(--sw);border:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--bg);transition:transform .2s}
.sw:hover{transform:scale(1.1)}.sw.on{outline:2px solid var(--acc);outline-offset:2px}
.sz{min-width:56px;padding:6px 14px;border:1px solid var(--line);border-radius:99px;font-size:.85rem;transition:.2s}
.sz.on,.sz:hover{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.shr{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 14px;font-size:.82rem;transition:.2s}
.chip svg{width:16px;height:16px}.chip:hover{border-color:var(--acc)}.chip.on svg{fill:#e5384f;stroke:#e5384f}
.ship{padding:12px 20px;border-bottom:1px solid var(--line);background:var(--bg2)}
.ship p{font-size:.85rem;margin-bottom:8px}.ship.done p{font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transform-origin:left center;transform:scaleX(var(--p,0));transition:transform .4s ease}
html[dir=rtl] .bar i{transform-origin:right center}
.ci-ico{width:64px;height:64px;border-radius:10px;background:var(--bg2);display:grid;place-items:center;color:var(--acc);flex:none}
.ci-v{font-size:.78rem;color:var(--mute)}
.xs-w{padding-top:18px}.xs-w h5{font-size:.9rem;margin-bottom:10px}
.xs-g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.xs{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg2)}
.xs-i{width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--acc);margin-bottom:4px}
.xs b{font-size:.85rem}.xs small{color:var(--mute);font-size:.72rem;line-height:1.3}
.xs-p{font-size:.82rem;font-weight:600;margin-top:2px}
.xs-b{margin-top:6px;border:1px solid var(--fg);border-radius:8px;padding:5px;font-size:.78rem;font-weight:600;transition:.2s}.xs-b:hover{background:var(--fg);color:var(--bg)}
@media(max-width:640px){.toasts{inset-inline:16px;width:auto}}
@media(max-width:760px){.md{grid-template-columns:1fr;gap:18px;padding:16px}}
@media(max-width:900px){nav{display:none}.logo{margin-inline-end:auto}.hero{grid-template-columns:1fr}.hero-t{padding:32px 24px}.ft{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.vals{grid-template-columns:1fr}.hd-in{flex-wrap:wrap;padding-block:10px}.search{order:9;width:100%}.ft{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.hd,.bd,.cd{will-change:auto}}
/* ===================== WHEEL (عجلة الحظ) — CSS ===================== */
.wh{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(2,6,23,.64);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s ease}
.wh[hidden]{display:none}
.wh.on{opacity:1;pointer-events:auto}
.wh-card{position:relative;width:min(440px,100%);margin:auto;padding:30px 24px 24px;border-radius:26px;text-align:center;color:#f8fafc;background:linear-gradient(160deg,rgba(30,41,59,.82),rgba(15,23,42,.92));-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border:1px solid rgba(255,255,255,.1);box-shadow:0 40px 90px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.07);transform:translateY(14px) scale(.98);transition:transform .35s cubic-bezier(.2,.8,.2,1);outline:0}
.wh.on .wh-card{transform:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.wh-card{background:#0f172a}.wh{background:rgba(2,6,23,.85)}}
.wh :focus-visible{outline:2px solid #a5b4fc;outline-offset:2px}
.wh-x{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#cbd5e1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);transition:background .2s,color .2s,opacity .2s}
.wh-x:hover{background:rgba(255,255,255,.13);color:#fff}
.wh-x:disabled{opacity:.3;cursor:not-allowed}
.wh-x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.wh h2{font-size:clamp(1.35rem,4.6vw,1.7rem);line-height:1.3;font-weight:700;letter-spacing:-.2px;padding-inline:30px;margin:0}
.wh-sub{color:#94a3b8;font-size:.92rem;margin-top:4px}
.wh-stage{position:relative;width:min(100%,330px);aspect-ratio:1;margin:36px auto 20px}
.wh-stage::before{content:"";position:absolute;inset:3%;border-radius:50%;box-shadow:0 24px 50px -14px rgba(0,0,0,.65),0 0 70px rgba(99,102,241,.22)}
.wh-cv{position:relative;display:block;width:100%;height:100%;border-radius:50%;will-change:transform}
.wh-ptr{position:absolute;top:-28px;left:50%;width:30px;margin-left:-15px;z-index:2;filter:drop-shadow(0 4px 8px rgba(0,0,0,.55))}
.wh-ptr svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 28%}
.wh-hub{position:absolute;z-index:1;left:50%;top:50%;width:17%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#334155,#0f172a 70%);border:2px solid rgba(165,180,252,.55);box-shadow:0 4px 14px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12)}

/* MICRO-INTERACTIONS */
/* ============ CSS — Fly-to-cart · Quick View · Countdown bar (Slate #0f172a / Indigo #6366f1) ============ */
html{scroll-padding-top:calc(var(--bar-h,0px) + 76px)}

/* ---- 1) Fly-to-cart ---- */
.mi-fly{position:fixed;left:0;top:0;z-index:110;border-radius:14px;background:#1e293b center/cover no-repeat;border:2px solid rgba(165,180,252,.85);box-shadow:0 12px 30px -6px rgba(15,23,42,.65);pointer-events:none;will-change:transform,opacity}
.mi-ring{position:fixed;z-index:110;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:2px solid #6366f1;box-shadow:0 0 18px rgba(99,102,241,.6);pointer-events:none;will-change:transform,opacity}

/* ---- 2) Quick View: زرار الكارت ---- */
.qv{position:absolute;top:48px;inset-inline-end:8px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(15,23,42,.72);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);box-shadow:var(--shadow-sm);opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s,background .2s}
.qv svg{width:17px;height:17px}
.card:hover .qv,.qv:focus-visible{opacity:1;transform:none}
.qv:hover{background:#6366f1}
@media(hover:none),(pointer:coarse){.qv{opacity:1;transform:none;width:40px;height:40px;top:52px}.fav{width:40px;height:40px}}

/* ---- 2) Quick View: النافذة الزجاجية ---- */
.qv-ov{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px;overflow-y:auto;background:rgba(2,6,23,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s ease}
.qv-ov[hidden]{display:none}
.qv-ov.on{opacity:1;pointer-events:auto}
.qv-card{position:relative;width:min(880px,100%);margin:auto;display:grid;grid-template-columns:1.05fr 1fr;gap:26px;padding:24px;border-radius:26px;color:#f8fafc;background:linear-gradient(160deg,rgba(30,41,59,.82),rgba(15,23,42,.92));-webkit-backdrop-filter:blur(20px) saturate(140%);backdrop-filter:blur(20px) saturate(140%);border:1px solid rgba(255,255,255,.1);box-shadow:0 40px 90px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.07);transform:translateY(14px) scale(.98);transition:transform .35s cubic-bezier(.2,.8,.2,1);outline:0}
.qv-ov.on .qv-card{transform:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.qv-card{background:#0f172a}.qv-ov{background:rgba(2,6,23,.85)}}
.qv-ov :focus-visible{outline:2px solid #a5b4fc;outline-offset:2px}
.qv-x{position:absolute;top:12px;inset-inline-end:12px;z-index:3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#cbd5e1;background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.12);transition:background .2s,color .2s}
.qv-x:hover{background:rgba(255,255,255,.14);color:#fff}
.qv-x svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.qv-main{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;background:#1e293b;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.qv-sl{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s ease;-webkit-user-drag:none}
.qv-sl.on{opacity:1}
.qv-nav{position:absolute;top:50%;margin-top:-20px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;background:rgba(15,23,42,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);transition:background .2s}
.qv-nav:hover{background:#6366f1}
.qv-nav.prev{inset-inline-start:10px}.qv-nav.next{inset-inline-end:10px}
.qv-nav svg{width:18px;height:18px;transform:rotate(90deg)}
.qv-nav.next svg{transform:rotate(-90deg)}
html[dir=rtl] .qv-nav.prev svg{transform:rotate(-90deg)}
html[dir=rtl] .qv-nav.next svg{transform:rotate(90deg)}
.qv-dots{position:absolute;bottom:10px;inset-inline:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.qv-dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.4);transition:width .25s,background .25s}
.qv-dots i.on{width:18px;background:#818cf8}
.qv-th{display:flex;gap:10px;margin-top:10px}
.qv-t{width:62px;height:62px;border-radius:12px;overflow:hidden;border:2px solid transparent;opacity:.65;background:#1e293b;transition:opacity .2s,border-color .2s}
.qv-t.on{border-color:#6366f1;opacity:1}
.qv-t img{width:100%;height:100%;object-fit:cover}
.qv-info{display:flex;flex-direction:column;min-width:0}
.qv-info h3{font-size:1.4rem;line-height:1.3;font-weight:700;padding-inline-end:46px;margin:0}
.qv-pr{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:1.55rem;font-weight:700;margin-top:8px}
.qv-pr s{font-size:.95rem;font-weight:400;color:#94a3b8}
.qv-off{font-size:.78rem;font-weight:700;padding:2px 10px;border-radius:99px;background:#6366f1;color:#fff}
.qv-sv{color:#94a3b8;font-size:.85rem}
.qv-ds{color:#cbd5e1;font-size:.92rem;margin-top:10px}
.qv-vr{margin-top:16px}
.qv-vl{display:block;font-size:.85rem;color:#94a3b8;margin-bottom:8px}.qv-vl b{color:#f8fafc}
.qv-sws,.qv-szs{display:flex;gap:10px;flex-wrap:wrap}
.qv-sw{width:34px;height:34px;border-radius:50%;background:var(--sw);border:1px solid rgba(255,255,255,.25);box-shadow:inset 0 0 0 2px #0f172a;transition:transform .2s}
.qv-sw:hover{transform:scale(1.1)}.qv-sw.on{outline:2px solid #6366f1;outline-offset:3px}
.qv-sz{min-width:58px;min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.16);color:#e2e8f0;font-size:.88rem;transition:background .2s,border-color .2s,color .2s}
.qv-sz:hover{border-color:#818cf8}.qv-sz.on{background:#6366f1;border-color:#6366f1;color:#fff}
.qv-act{margin-top:auto;padding-top:20px;display:grid;gap:10px}
.qv-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;padding:12px 16px;border-radius:14px;font-weight:700;font-size:1rem;color:#fff;background:#6366f1;box-shadow:0 12px 26px -10px rgba(99,102,241,.8),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .2s,filter .2s}
.qv-btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.qv-btn.ghost{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);box-shadow:none;color:#e2e8f0}
.qv-btn svg{width:19px;height:19px}.qv-btn.ghost svg{color:#a5b4fc}
.qv-link{display:block;margin-top:14px;text-align:center;color:#a5b4fc;font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
.qv-link:hover{color:#fff}
@media(max-width:760px){.qv-card{grid-template-columns:1fr;gap:16px;padding:16px;border-radius:22px}.qv-info h3{padding-inline-end:0}.qv-act{padding-top:14px}}

/* ---- 3) Countdown bar (Sticky top) ---- */
.mi-bar{position:sticky;top:0;z-index:20;display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s .3s;background:linear-gradient(90deg,#0f172a,#1e1b4b 55%,#0f172a);color:#f8fafc;border-bottom:1px solid rgba(99,102,241,.45);box-shadow:0 8px 24px -12px rgba(15,23,42,.8)}
.mi-bar.on{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease}
.mi-bar-w{min-height:0;overflow:hidden}
.mi-bar-in{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px 14px;max-width:1200px;margin:auto;padding:8px 14px;font-size:.9rem}
.mi-bar-msg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.mi-bar-msg b{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;direction:ltr;unicode-bidi:isolate;color:#c7d2fe}
.mi-clock{min-width:68px;padding:3px 10px;border-radius:99px;text-align:center;direction:ltr;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:700;letter-spacing:.04em;background:rgba(99,102,241,.22);border:1px solid rgba(165,180,252,.4)}
.mi-clock.low{color:#fcd34d;animation:miPulse 1s ease-in-out infinite}
@keyframes miPulse{50%{opacity:.55}}
.mi-bar-copy{min-height:36px;padding:0 16px;border-radius:99px;background:#6366f1;color:#fff;font-weight:700;font-size:.82rem;transition:filter .2s}
.mi-bar-copy:hover{filter:brightness(1.12)}
.mi-bar-x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#cbd5e1;transition:background .2s}
.mi-bar-x:hover{background:rgba(255,255,255,.1);color:#fff}
.mi-bar-x svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mi-bar.gone .mi-clock,.mi-bar.gone .mi-bar-copy{display:none}
@media(pointer:coarse){.mi-bar-copy{min-height:40px}.mi-bar-x{width:40px;height:40px}}
@media(max-width:640px){.mi-bar-in{font-size:.84rem;padding:8px 10px}.mi-bar-msg{flex-basis:100%}}
/* ===================== SECTION NAV ANIMATION ===================== */
main>section[tabindex="-1"]:focus{outline:0}
.sec-anim .sec-h,.sec-anim .tabs,.sec-anim .card,.sec-anim .rev,.sec-anim .faq-it,.sec-anim .hero-t,.sec-anim .hero-a{animation:secIn .85s cubic-bezier(.22,.8,.24,1) calc(var(--sec-delay,0ms) + var(--i,0)*70ms) both;will-change:transform,opacity}
@keyframes secIn{from{opacity:0;transform:translate3d(0,32px,0)}to{opacity:1;transform:none}}

@keyframes secInSoft{from{opacity:.4;transform:translate3d(0,16px,0)}to{opacity:1;transform:none}}

</style>

/* ---------- إشعارات Toast ---------- */
function toast(msg,label,fn){
  const box=$('#toasts');
  while(box.children.length>=3)box.firstChild.remove();
  const el=document.createElement('div');el.className='ts';
  const sp=document.createElement('span');sp.textContent=msg;el.append(sp);
  let tm;
  const kill=()=>{clearTimeout(tm);el.classList.add('out');setTimeout(()=>el.remove(),260)};
  if(label){const b=document.createElement('button');b.className='ta';b.textContent=label;b.onclick=()=>{kill();fn()};el.append(b)}
  const x=document.createElement('button');x.className='tx';x.setAttribute('aria-label',T('close'));x.textContent='×';x.onclick=kill;el.append(x);
  box.append(el);tm=setTimeout(kill,3000);
}

/* ---------- تنقّل الأقسام: سكرول ناعم + Class انيميشن بيتحط على القسم أول ما الزرار يتضغط ---------- */
const NAV_ITEMS='.sec-h,.tabs,.card,.rev,.faq-it,.hero-t,.hero-a';  /* عناصر القسم اللي بتتحرك ورا بعض */
let navRaf=0;
function navAnim(el,delay,soft){
  clearTimeout(el._navT);
  el.classList.remove('sec-anim','sec-soft');
  const items=el.querySelectorAll(NAV_ITEMS);
  items.forEach((n,i)=>n.style.setProperty('--i',Math.min(i,12)));
  el.style.setProperty('--sec-delay',delay+'ms');
  void el.offsetWidth;                              /* يعيد تشغيل الانيميشن لو اتضغط تاني */
  el.classList.add('sec-anim');if(soft)el.classList.add('sec-soft');
  el._navT=setTimeout(()=>{el.classList.remove('sec-anim','sec-soft');items.forEach(n=>n.style.removeProperty('--i'))},delay+Math.min(items.length,13)*70+1100);
}
function navScroll(y,dur){
  cancelAnimationFrame(navRaf);
  if(!dur){scrollTo(0,y);return}
  const y0=scrollY,dy=y-y0,t0=performance.now(),ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const evs=['wheel','touchstart','keydown','mousedown'];
  const stop=()=>{cancelAnimationFrame(navRaf);evs.forEach(ev=>removeEventListener(ev,stop))};   /* المستخدم لمس الشاشة: نسيب السكرول ليه */
  evs.forEach(ev=>addEventListener(ev,stop,{passive:true}));
  const step=now=>{const p=Math.min(1,(now-t0)/dur);scrollTo(0,y0+dy*ease(p));if(p<1)navRaf=requestAnimationFrame(step);else stop()};
  navRaf=requestAnimationFrame(step);
}
function goToSection(id){
  const el=id?document.getElementById(id):$('main > section');   /* id فاضي = فوق (الهيرو) */
  if(!el)return false;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const barH=parseFloat(getComputedStyle(H).getPropertyValue('--bar-h'))||0,hd=$('.hd');
  const off=barH+(hd?hd.offsetHeight:66)+14;                      /* تحت الهيدر (حتى لو لفّ على الموبايل) وشريط العدّاد */
  const r=el.getBoundingClientRect();
  const y=id?Math.max(0,Math.round(scrollY+r.top-off)):0,dist=Math.abs(y-scrollY);
  const seen=r.top<innerHeight*.6&&r.bottom>off+60;               /* القسم ظاهر قدامه أصلًا */
  const dur=reduce||dist<4?0:Math.round(Math.min(1100,Math.max(480,dist*.45)));
  navAnim(el,seen||!dur?0:Math.round(dur*.55),seen);              /* 1) الكلاس فورًا — والانيميشن يبدأ لما القسم يقرّب */
  navScroll(y,dur);                                               /* 2) سكرول ناعم من غير ما يغيّر الرابط */
  el.setAttribute('tabindex','-1');el.focus({preventScroll:true});/* 3) الفوكس للقسم عشان قارئ الشاشة والكيبورد */
  return true;
}
/* أي لينك داخلي (#shop / #faq / # للرئيسية) من القائمة أو الهيرو أو الفوتر */
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="#"]');
  if(!a||a.dataset.info!==undefined||a.target||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey)return;
  const h=a.getAttribute('href'),id=h==='#'?'':h.slice(1);
  if(id&&!document.getElementById(id))return;                     /* مش قسم عندنا (زي #p=...): سيبه للمتصفح */
  if(goToSection(id))e.preventDefault();
});

/* ---------- تفويض النقر العام ---------- */
document.addEventListener('click',e=>{
  const info=e.target.closest('a[data-info]');
  if(info){e.preventDefault();$('#infoT').textContent=T(info.dataset.info+'T');$('#infoB').textContent=T(info.dataset.info+'B');openModal('#infoM');return}
  const t=e.target.closest('button');if(!t)return;
  if(t.id=='ix'){closeModal('#infoM');return}
  if(t.classList.contains('faq-q')){t.closest('.faq-it').classList.toggle('open');return}
  if(t.dataset.c){cat=t.dataset.c;renderTabs();renderGrid();return}
  if(t.dataset.f!==undefined){toggleWish(t.dataset.f);return}
  if(t.dataset.add!==undefined){addToCart(t.dataset.add);return}
  if(t.dataset.o!==undefined){openM(t.dataset.o);return}
  if(t.dataset.g!==undefined){gi=+t.dataset.g;fillGal();return}
  if(t.dataset.col!==undefined){SEL.c=+t.dataset.col;gi=0;selUpdate();fillGal();return}
  if(t.dataset.siz!==undefined){SEL.s=+t.dataset.siz;selUpdate();return}
  if(t.dataset.q){Q=Math.max(1,Math.min(99,Q+ +t.dataset.q));$('#mi output').textContent=Q;$('#tt').textContent=T('tot')+': '+fmt(byId(cur).p*Q);return}
  if(t.id=='modalAdd'){const p=byId(cur);addToCart(cur,Q,p.colors?SEL.c:null,p.sizes?SEL.s:null);return}
  if(t.id=='modalBuy'){const p=byId(cur);QUICK={id:cur,q:Q,c:p.colors?SEL.c:null,s:p.sizes?SEL.s:null};closeM();openCheckout('quick');return}
  if(t.id=='wishToggle'){toggleWish(cur);return}
  if(t.id=='shareWa'){const p=byId(cur);open('https://wa.me/?text='+encodeURIComponent(p.n[L]+' — '+fmt(p.p)+'\n'+shareUrl(cur)),'_blank');return}
  if(t.id=='shareCopy'){const u=shareUrl(cur);copyText(u).then(ok=>{if(ok)toast(T('copied'));else prompt(T('copyManual'),u)});return}
  if(t.dataset.cq!==undefined){setQty(t.dataset.cq,(CART[t.dataset.cq]||0)+ +t.dataset.d);return}
  if(t.dataset.crm!==undefined){setQty(t.dataset.crm,0);return}
  if(t.dataset.xadd!==undefined){addToCart(t.dataset.xadd);return}
  if(t.id=='ckBtn'){closeDrawer();openCheckout('cart');return}
  if(t.dataset.goto){closeDrawer();goToSection(t.dataset.goto);return}
  if(t.id=='discApply'){applyCode($('#discInput').value);renderCart();return}
  if(t.id=='coDiscApply'){applyCode($('#coDisc').value);fillCheckout(CO_SRC);return}
  if(t.dataset.am){authMode=t.dataset.am;fillLogin();return}
  if(t.id=='asub'){const n=authMode=='register'?$('#afn').value.trim():$('#aem').value.trim().split(/[@\s]/)[0];USER=n||(L?'Guest':'زائر');S.s('user',USER);fillLogin();return}
  if(t.id=='logoutBtn'){USER=null;S.s('user','');authMode='login';fillLogin();return}
});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;if(e.target.id=='discInput'){e.preventDefault();$('#discApply').click()}else if(e.target.id=='coDisc'){e.preventDefault();$('#coDiscApply').click()}});
$('#lang').onclick=()=>{L=1-L;S.s('lang',L?'en':'ar');render()};
function setTheme(t){
  const f=$('#fade');
  f.style.willChange='opacity';f.style.transition='none';
  f.style.background=getComputedStyle(H).getPropertyValue('--bg').trim();
  f.style.opacity='1';
  void f.offsetHeight; /* يجبر المتصفح يثبّت القفزة الفورية قبل ما نبدّل الثيم تحتها */
  H.dataset.theme=t;S.s('theme',t);
  requestAnimationFrame(()=>{
    f.style.transition='opacity .3s ease';
    requestAnimationFrame(()=>{f.style.opacity='0';setTimeout(()=>{f.style.willChange='auto'},320)});
  });
}
$('#theme').onclick=()=>setTheme(H.dataset.theme=='dark'?'light':'dark');
document.addEventListener('keydown',e=>{
  if(e.key!='Escape')return;
  if(!$('#infoM').hidden)closeModal('#infoM');
  else if(!$('#checkoutM').hidden)closeModal('#checkoutM');
  else if(!$('#loginM').hidden)closeModal('#loginM');
  else if(cur!=null)closeM();
  else if(drawerOpen())closeDrawer();
});
render();
hashOpen();

<script>
/* ===================== WHEEL (عجلة الحظ) — JS =====================
   كل حاجة في الـ IIFE دي لوحدها. بتعتمد (اختياريًا) على lock()/unlock() و CODES بتوع المتجر.
   API:  ElcobyWheel.open()   يفتح العجلة (لو اتلفّت قبل كده بيعرض الجايزة بس)
         ElcobyWheel.reset()  يمسح الحالة المحفوظة (للتجربة)
         ElcobyWheel.prize()  {code} لو فيه كود لسه ماتستخدمش، وإلا null                    */
(()=>{
'use strict';
const KEY='elcoby_wheel',SKEY='elcoby_wheel_dismissed';
const DELAY=6000;     /* بعد كام ملّي ثانية من فتح الصفحة تظهر العجلة */
const WINDOW=60000;   /* لو الشاشة مشغولة (مودال/سلة) بنحاول لحد المدة دي وبعدها نبطّل في الزيارة دي */
const SPIN_MS=5400;   /* مدة الدوران */
const OFFER=(typeof OFFER_MIN==='number'?OFFER_MIN:15)*60000;  /* صلاحية الكود بعد الفوز */
const deadline=s=>(s.w||s.t)+OFFER;

/* الشرائح بالترتيب مع عقارب الساعة بدءًا من الأعلى.  w = الوزن (الاحتمال النسبي للفوز) — دلوقتي متساوية */
const SL=[
  {code:'SAVE5',   w:1,l:['خصم 5%','5% off']},
  {code:'FREESHIP',w:1,l:['شحن مجاني','Free shipping']},
  {code:'SAVE10',  w:1,l:['خصم 10%','10% off']},
  {code:null,      w:1,l:['حظ سعيد المرة القادمة!','Better luck next time!']},
  {code:'OFF20',   w:1,l:['خصم 20 ج.م','EGP 20 off']},
  {code:'OFF50',   w:1,l:['خصم 50 ج.م','EGP 50 off']}
];
/* شروط الأكواد (t: pct | flat | ship ، min: أقل قيمة للطلب). بتتقرأ من CODES بتاعة المتجر لو موجودة */
const RULES=(typeof CODES==='object'&&CODES)||{SAVE5:{t:'pct',min:0},FREESHIP:{t:'ship',min:300},SAVE10:{t:'pct',min:400},OFF20:{t:'flat',min:250},OFF50:{t:'flat',min:600}};
const TX={
  ar:{title:'جرب حظك اليوم 🎁',sub:'احصل على كود خصم حصري لطلبك القادم',spin:'لف العجلة',spinning:'جارٍ التدوير…',copy:'نسخ الكود',copied:'تم النسخ ✓',manual:'انسخه يدويًا',close:'إغلاق',shop:'تسوّق الآن',yours:'مبروك! كسبت',thanks:'شكرًا لمشاركتك',expired:'انتهت صلاحية هذا الكود',valid:' · صالح لمدة {m} دقيقة'},
  en:{title:'Try your luck today 🎁',sub:'Win an exclusive discount code for your next order',spin:'Spin the wheel',spinning:'Spinning…',copy:'Copy code',copied:'Copied ✓',manual:'Copy manually',close:'Close',shop:'Shop now',yours:'Congratulations! You won',thanks:'Thanks for playing',expired:'This code has expired',valid:' · valid for {m} minutes'}
};
const PAL=[['#3b34b8','#5558e6'],['#1a2336','#2c3a54'],['#322e9a','#4b4fd6'],['#162033','#2a3850'],['#2b2788','#4144c4'],['#1c2639','#33415c']];

const q=s=>document.querySelector(s);
const wh=q('#wh'),card=q('#wh-card'),cv=q('#wh-cv'),ptr=q('.wh-ptr svg'),xBtn=q('#wh-x'),spinBtn=q('#wh-spin'),act=q('#wh-act'),res=q('#wh-res');
const per=360/SL.length;
let lang='ar',rot=0,hi=null,isOpen=false,spinning=false,lastFocus=null,mem=null,lastIdx=-1,rt;

const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}};
const state=()=>load()||mem;
const persist=o=>{mem=o;try{localStorage.setItem(KEY,JSON.stringify(o))}catch(e){}};
const dismissed=()=>{try{return sessionStorage.getItem(SKEY)}catch(e){return null}};
const setDismissed=()=>{try{sessionStorage.setItem(SKEY,'1')}catch(e){}};
const lockBody=()=>{typeof lock==='function'?lock():document.body.style.overflow='hidden'};
const unlockBody=()=>{typeof unlock==='function'?unlock():document.body.style.overflow=''};
const finalAngle=i=>360-(i*per+per/2);               /* الزاوية اللي بتخلّي مركز الشريحة i تحت المؤشر */
const under=r=>Math.floor((((-r)%360+360)%360)/per);  /* أنهي شريحة تحت المؤشر عند زاوية r */

function terms(code){
  const r=RULES[code];if(!r)return'';const m=r.min||0;
  if(lang==='en')return r.t==='ship'?`Free shipping applies to orders of EGP ${m} or more`:m?`Discount applies to purchases of EGP ${m} or more`:'Discount applies to all purchases, no minimum';
  return r.t==='ship'?`يطبق الشحن المجاني على الطلبات بقيمة ${m} ج.م أو أكثر`:m?`يطبق الخصم على المشتريات بقيمة ${m} ج.م أو أكثر`:'يطبق الخصم على جميع المشتريات بدون حد أدنى';
}
function setTexts(){
  const t=TX[lang];
  q('#wh-title').textContent=t.title;q('#wh-sub').textContent=t.sub;
  spinBtn.textContent=t.spin;xBtn.setAttribute('aria-label',t.close);
  q('#wh-shop').textContent=t.shop;q('#wh-copy').textContent=t.copy;
}

/* ---------- الرسم (Canvas بدقة الشاشة) ---------- */
function wrap(g,txt,maxW){
  const out=[];let cur='';
  txt.split(' ').forEach(w=>{const t=cur?cur+' '+w:w;if(!cur||g.measureText(t).width<=maxW)cur=t;else{out.push(cur);cur=w}});
  if(cur)out.push(cur);return out;
}
function draw(){
  const S=cv.clientWidth||300,d=Math.min(window.devicePixelRatio||1,3);
  cv.width=cv.height=Math.round(S*d);
  const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,S,S);
  const c=S/2,R0=c-2,rim=Math.max(8,S*.034),R=R0-rim,n=SL.length,a=Math.PI*2/n,ar=lang==='ar';
  /* الإطار الخارجي + نقاط الإضاءة */
  const rg=g.createLinearGradient(0,0,S,S);rg.addColorStop(0,'#475569');rg.addColorStop(.5,'#1e293b');rg.addColorStop(1,'#475569');
  g.beginPath();g.arc(c,c,R0,0,Math.PI*2);g.fillStyle=rg;g.fill();
  for(let i=0;i<n*4;i++){
    const t=-Math.PI/2+i*a/4,rr=R0-rim/2;
    g.beginPath();g.arc(c+Math.cos(t)*rr,c+Math.sin(t)*rr,Math.max(1.3,rim*.13),0,Math.PI*2);
    g.fillStyle=i%4===0?'rgba(199,210,254,.95)':'rgba(255,255,255,.3)';g.fill();
  }
  /* الشرائح */
  SL.forEach((s,i)=>{
    const a0=-Math.PI/2+i*a,a1=a0+a,p=PAL[i%PAL.length];
    const gr=g.createRadialGradient(c,c,R*.1,c,c,R);gr.addColorStop(0,p[0]);gr.addColorStop(1,p[1]);
    g.beginPath();g.moveTo(c,c);g.arc(c,c,R,a0,a1);g.closePath();
    g.fillStyle=gr;g.fill();g.strokeStyle='rgba(255,255,255,.12)';g.lineWidth=1.2;g.stroke();
    if(hi!==null&&hi!==i){g.fillStyle='rgba(2,6,23,.52)';g.fill()}   /* بعد الفوز: باقي الشرائح بتخفت */
    /* النص ماشي مع نصف القطر ونهايته عند الحافة */
    g.save();g.translate(c,c);g.rotate(a0+a/2);
    g.textBaseline='middle';g.textAlign='right';g.direction=ar?'rtl':'ltr';g.fillStyle='#f8fafc';
    const maxW=R*.6,xEnd=R-R*.085,txt=s.l[ar?0:1];
    let fs=R*.112,lines;
    for(;fs>9;fs-=.5){
      g.font=`700 ${fs}px Cairo,Poppins,system-ui,sans-serif`;lines=wrap(g,txt,maxW);
      if(lines.length<=2&&lines.every(t=>g.measureText(t).width<=maxW))break;
    }
    const lh=fs*1.2;lines.forEach((t,k)=>g.fillText(t,xEnd,(k-(lines.length-1)/2)*lh));
    g.restore();
  });
  g.beginPath();g.arc(c,c,R,0,Math.PI*2);g.strokeStyle='rgba(255,255,255,.2)';g.lineWidth=1.5;g.stroke();
}

/* ---------- الاختيار والدوران ---------- */
function pick(){
  const tot=SL.reduce((a,s)=>a+s.w,0);let r=Math.random()*tot;
  for(let i=0;i<SL.length;i++){r-=SL[i].w;if(r<0)return i}
  return SL.length-1;
}
function tick(){
  if(reduced())return;
  try{ptr.animate([{transform:'rotate(0deg)'},{transform:'rotate(-18deg)',offset:.4},{transform:'rotate(0deg)'}],{duration:130,easing:'ease-out'})}catch(e){}
}
function showResult(i){
  const s=SL[i],t=TX[lang];
  act.hidden=true;res.hidden=false;
  q('#wh-lbl').hidden=!s.code;q('#wh-lbl').textContent=t.yours;
  q('#wh-prize').textContent=s.l[lang==='ar'?0:1];
  q('#wh-codebox').hidden=!s.code;q('#wh-code').textContent=s.code||'';
  const st=state(),exp=!!(s.code&&st&&Date.now()>deadline(st));
  q('#wh-terms').textContent=s.code?(exp?t.expired:terms(s.code)+t.valid.replace('{m}',OFFER/60000)):t.thanks;
}
function spin(){
  if(spinning||state())return;
  const idx=pick(),s=SL[idx];
  persist({i:idx,code:s.code,t:Date.now(),used:0});    /* بنحفظ النتيجة قبل ما العجلة تلف — الريفرش مش بيدّي فرصة تانية */
  spinning=true;spinBtn.disabled=true;xBtn.disabled=true;spinBtn.textContent=TX[lang].spinning;card.focus({preventScroll:true});
  const cur=((rot%360)+360)%360;
  const need=((finalAngle(idx)-cur)%360+360)%360;
  const total=(5+Math.floor(Math.random()*2))*360+need;   /* 5 أو 6 لفّات كاملة + الباقي لحد مركز الشريحة */
  const from=rot,dur=reduced()?0:SPIN_MS+Math.random()*500,t0=performance.now();
  lastIdx=under(rot);
  const frame=now=>{
    const p=dur?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-p,4);   /* ease-out quartic: سريعة في الأول وبتهدى تدريجيًا */
    rot=from+total*e;cv.style.transform=`rotate(${rot}deg)`;
    const k=under(rot);if(k!==lastIdx){lastIdx=k;tick()}
    if(p<1)requestAnimationFrame(frame);else done(idx);
  };
  requestAnimationFrame(frame);
}
function done(idx){
  spinning=false;hi=idx;
  const st=state();if(st){st.w=Date.now();persist(st)}   /* العدّاد بيبدأ من لحظة ظهور النتيجة */
  draw();showResult(idx);xBtn.disabled=false;
  if(SL[idx].code)document.dispatchEvent(new CustomEvent('elcoby:wheelwin',{detail:{code:SL[idx].code}}));
  (SL[idx].code?q('#wh-copy'):q('#wh-shop')).focus({preventScroll:true});
}

/* ---------- فتح / قفل ---------- */
function open(){
  if(isOpen)return;
  isOpen=true;lang=document.documentElement.lang==='en'?'en':'ar';setTexts();
  lastFocus=document.activeElement;wh.hidden=false;lockBody();
  const st=state();hi=st?st.i:null;rot=st?finalAngle(st.i):0;cv.style.transform=`rotate(${rot}deg)`;
  act.hidden=!!st;res.hidden=!st;spinBtn.disabled=false;xBtn.disabled=false;
  if(st)showResult(st.i);
  const go=()=>{draw();requestAnimationFrame(()=>{wh.classList.add('on');(st?(st.code?q('#wh-copy'):q('#wh-shop')):spinBtn).focus({preventScroll:true})})};
  document.fonts&&document.fonts.load?document.fonts.load('700 16px Cairo').then(go,go):go();
}
function close(){
  if(!isOpen||spinning)return;
  isOpen=false;wh.classList.remove('on');
  if(!state())setDismissed();                    /* قفلها من غير ما يلف: ماتظهرش تاني في نفس الزيارة */
  setTimeout(()=>{wh.hidden=true;unlockBody();lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true})},reduced()?0:300);
}

/* ---------- نسخ الكود ---------- */
function copyText(txt){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;top:0;opacity:0';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok};
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(txt).then(()=>true,()=>fallback());
  return Promise.resolve(fallback());
}
q('#wh-copy').onclick=async()=>{
  const b=q('#wh-copy'),t=TX[lang],ok=await copyText(q('#wh-code').textContent);
  b.textContent=ok?t.copied:t.manual;
  if(!ok){const r=document.createRange();r.selectNodeContents(q('#wh-code'));const s=getSelection();s.removeAllRanges();s.addRange(r)}
  setTimeout(()=>{b.textContent=t.copy},2000);
};

/* ---------- الأحداث ---------- */
spinBtn.onclick=spin;
xBtn.onclick=close;
wh.addEventListener('click',e=>{if(e.target===wh)close()});
q('#wh-shop').onclick=()=>{close();const s=q('#shop');s&&setTimeout(()=>{typeof goToSection==='function'?goToSection('shop'):s.scrollIntoView({behavior:reduced()?'auto':'smooth'})},320)};
document.addEventListener('keydown',e=>{
  if(!isOpen)return;
  if(e.key==='Escape'){if(!spinning)close();return}
  if(e.key!=='Tab')return;
  const f=[...wh.querySelectorAll('button:not([disabled])')].filter(el=>el.offsetParent!==null);
  if(!f.length){e.preventDefault();return}
  const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===a||document.activeElement===card)){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
});
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(isOpen)draw()},150)});

/* ---------- الظهور التلقائي (مرة واحدة بس لكل مستخدم) ---------- */
function schedule(){
  if(state()||dismissed())return;
  const t0=Date.now();
  const attempt=()=>{
    if(state()||isOpen||Date.now()-t0>DELAY+WINDOW)return;
    const busy=(typeof LOCK==='number'&&LOCK>0)||document.visibilityState!=='visible';
    busy?setTimeout(attempt,3000):open();
  };
  setTimeout(attempt,DELAY);
}

window.ElcobyWheel={
  open,close,
  reset(){try{localStorage.removeItem(KEY);sessionStorage.removeItem(SKEY)}catch(e){}mem=null},
  prize(){const s=state();return s&&s.code&&!s.used&&Date.now()<=deadline(s)?{code:s.code}:null},
  expired(code){const s=state();return !!(s&&s.code&&s.code===code&&Date.now()>deadline(s))},
  info(){const s=state();return s?Object.assign({},s,{deadline:deadline(s)}):null},
  markUsed(code){const s=state();if(s&&s.code===code&&!s.used){s.used=1;persist(s)}}
};
schedule();
})();
</script>
<script>
/* MICRO-INTERACTIONS */
/* ============ JS — Fly-to-cart · Quick View · Countdown bar ============
   بيعتمد على جلوبالز المتجر: P, byId, fmt, addToCart, openM, WA, FREE, CODES, DISCCODE, discAmt, codeShip, lock/unlock
   وعلى ElcobyWheel (للعدّاد). كل حاجة جوا IIFE لوحدها وبدون أي مكتبات. */
(()=>{
'use strict';
const q=s=>document.querySelector(s);
const reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const isEn=()=>document.documentElement.lang==='en';
const rtl=()=>document.documentElement.dir==='rtl';
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MX={
  add:['أضف للسلة','Add to cart'],wa:['طلب سريع عبر واتساب','Quick order on WhatsApp'],full:['عرض التفاصيل الكاملة','View full details'],
  color:['اللون','Colour'],size:['المقاس','Size'],close:['إغلاق','Close'],prev:['السابق','Previous'],next:['التالي','Next'],save:['وفّرت','You save'],
  brand:['الكوبي','ElCoby'],waTitle:['طلب سريع','Quick order'],tot:['الإجمالي','Total'],disc:['الخصم','Discount'],code:['كود الخصم','Promo code'],freeShip:['الشحن: مجاني ✓','Shipping: free ✓'],
  desc:{w:['ساعة بتصميم شبابي عصري تناسب الاستخدام اليومي.','A modern, youthful watch for everyday wear.'],s:['نظارة شمسية بتصميم عصري تكمّل إطلالتك.','Modern sunglasses that complete your look.'],c:['قطعة استانلس ستيل بتصميم شبابي، تلبسها كل يوم.','A youthful stainless steel piece for everyday wear.']},
  copy:['نسخ الكود','Copy code'],copied:['تم النسخ ✓','Copied ✓'],expires:['ينتهي خلال','Expires in'],gone:['انتهت مدة عرضك','Your offer has expired'],

};
const t=k=>MX[k][isEn()?1:0];

/* ---------- نسخ نص (Clipboard + fallback) ---------- */
function copyText(txt){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.cssText='position:fixed;top:0;opacity:0';document.body.append(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok};
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(txt).then(()=>true,()=>fb());
  return Promise.resolve(fb());
}

/* =====================================================================
   1) Fly-to-cart — الصورة بتطير في مسار قوسي (Bezier تربيعي) لأيقونة السلة + Pulse عند الوصول
   ===================================================================== */
function pulse(){
  const b=q('#cartBtn');if(!b||!b.animate)return;
  b.animate([{transform:'scale(1)'},{transform:'scale(1.3) rotate(-10deg)',offset:.3},{transform:'scale(.92) rotate(6deg)',offset:.6},{transform:'scale(1)'}],{duration:520,easing:'ease-out'});
  const c=q('#cnt');if(c)c.animate([{transform:'scale(1)'},{transform:'scale(1.5)'},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});
  const r=b.getBoundingClientRect(),ring=document.createElement('div');
  ring.className='mi-ring';ring.style.left=(r.left+r.width/2)+'px';ring.style.top=(r.top+r.height/2)+'px';document.body.append(ring);
  const a=ring.animate([{transform:'scale(.7)',opacity:.9},{transform:'scale(2.3)',opacity:0}],{duration:560,easing:'ease-out'});
  a.onfinish=a.oncancel=()=>ring.remove();
}
function fly(src,url){
  if(reduced()||!src)return;
  const btn=q('#cartBtn');if(!btn)return;
  const a=src.getBoundingClientRect(),b=btn.getBoundingClientRect();
  if(!a.width||!b.width)return;
  const size=Math.round(Math.min(76,Math.max(46,a.width*.3)));
  const sx=a.left+a.width/2,sy=a.top+a.height/2;
  const tx=b.left+b.width/2-sx,ty=b.top+b.height/2-sy;           /* الإزاحة من المركز للمركز */
  /* نقطة التحكم = منتصف الخط + إزاحة عمودية عليه → قوس واضح حتى لو السلة فوق المنتج مباشرة */
  const len=Math.hypot(tx,ty)||1,h=Math.max(70,Math.min(180,len*.3)),nx=-ty/len,ny=tx/len;
  const W=innerWidth,mx=tx/2,my=ty/2;
  const ctrl=k=>({x:mx+k*h*nx,y:my+k*h*ny});
  let k=Math.abs(ny)>.2?(ny<0?1:-1):(sx+ctrl(1).x>W/2?-1:1);      /* الجنب الأعلى، أو ناحية منتصف الشاشة لو الخط رأسي */
  const cp=ctrl(k);
  const cx=Math.max(8-sx,Math.min(W-8-sx,cp.x)),cy=Math.max(8-sy,cp.y); /* ما يخرجش بره الشاشة */
  const el=document.createElement('div');el.className='mi-fly';
  el.style.cssText=`width:${size}px;height:${size}px;left:${sx-size/2}px;top:${sy-size/2}px`+(url?`;background-image:url("${String(url).replace(/"/g,'%22')}")`:'');
  document.body.append(el);
  if(!el.animate){el.remove();pulse();return}
  const N=26,kf=[];
  for(let i=0;i<=N;i++){
    const p=i/N,e=.5-.5*Math.cos(Math.PI*p),u=1-e;                /* ease-in-out ناعم */
    const x=2*u*e*cx+e*e*tx,y=2*u*e*cy+e*e*ty;
    kf.push({transform:`translate3d(${x.toFixed(1)}px,${y.toFixed(1)}px,0) scale(${(1-.72*e).toFixed(3)}) rotate(${(-14*e).toFixed(1)}deg)`,opacity:p<.8?1:1-(p-.8)/.2*.9});
  }
  const an=el.animate(kf,{duration:850,easing:'linear',fill:'forwards'});
  an.onfinish=()=>{el.remove();pulse()};
  an.oncancel=()=>el.remove();
}
document.addEventListener('click',e=>{
  const add=e.target.closest('.add[data-add]');
  if(add){const card=add.closest('.card'),img=card&&card.querySelector('.pic img');fly(img||(card&&card.querySelector('.tile')),img&&(img.currentSrc||img.src));return}
  if(e.target.closest('#modalAdd')){const m=q('#mm'),img=m&&m.querySelector('img');fly(m,img&&img.src)}
});

/* =====================================================================
   2) Quick View — معاينة سريعة (معرض صور + لون/مقاس + إضافة للسلة + طلب واتساب)
   ===================================================================== */
const qvEl=q('#qv'),qvCard=q('#qv-card'),qvMain=q('#qv-main'),qvTh=q('#qv-th'),qvInfo=q('#qv-info'),qvX=q('#qv-x');
const QZ=['','transform:scale(1.9)','transform:scale(1.9);transform-origin:15% 85%'];  /* لو المنتج صورة واحدة: تكبيرات مختلفة منها */
let qid=null,sel={c:0,s:0},idx=0,qOpen=false,lastF=null,sx0=null;
const ix=()=>isEn()?1:0;
const lockB=()=>{typeof lock==='function'?lock():document.body.style.overflow='hidden'};
const unlockB=()=>{typeof unlock==='function'?unlock():document.body.style.overflow=''};
const prod=()=>byId(qid);
function slides(){const p=prod(),c=p.colors&&p.colors[sel.c],base=(c&&c.img)||p.img;return p.more?[base,...p.more].map(u=>[u,'']):QZ.map(z=>[base,z])}
function renderGal(){
  const p=prod(),sl=slides(),n=sl.length;idx=Math.min(idx,n-1);
  qvMain.innerHTML=sl.map((s,i)=>`<img class="qv-sl${i===idx?' on':''}" src="${esc(s[0])}" alt="${esc(p.n[ix()])}" style="${s[1]}" draggable="false" onerror="this.style.opacity=0">`).join('')
    +(n>1?`<button class="qv-nav prev" type="button" data-qn="-1" aria-label="${t('prev')}"><svg class="i"><use href="#chev"/></svg></button><button class="qv-nav next" type="button" data-qn="1" aria-label="${t('next')}"><svg class="i"><use href="#chev"/></svg></button><div class="qv-dots">${sl.map((_,i)=>`<i class="${i===idx?'on':''}"></i>`).join('')}</div>`:'');
  qvTh.innerHTML=n>1?sl.map((s,i)=>`<button class="qv-t${i===idx?' on':''}" type="button" data-qg="${i}" aria-label="${i+1}"><img src="${esc(s[0])}" alt="" style="${s[1]}" onerror="this.style.opacity=0"></button>`).join(''):'';
}
function go(i){
  const n=qvMain.querySelectorAll('.qv-sl').length;if(!n)return;
  idx=((i%n)+n)%n;
  qvMain.querySelectorAll('.qv-sl').forEach((e,k)=>e.classList.toggle('on',k===idx));
  qvMain.querySelectorAll('.qv-dots i').forEach((e,k)=>e.classList.toggle('on',k===idx));
  qvTh.querySelectorAll('.qv-t').forEach((e,k)=>e.classList.toggle('on',k===idx));
}
function renderInfo(focusSel){
  const p=prod(),L=ix();
  const col=p.colors?`<div class="qv-vr"><span class="qv-vl">${t('color')}: <b>${esc(p.colors[sel.c].n[L])}</b></span><div class="qv-sws">${p.colors.map((c,i)=>`<button class="qv-sw${i===sel.c?' on':''}" type="button" data-qc="${i}" style="--sw:${esc(c.h)}" aria-label="${esc(c.n[L])}" aria-pressed="${i===sel.c}"></button>`).join('')}</div></div>`:'';
  const siz=p.sizes?`<div class="qv-vr"><span class="qv-vl">${t('size')}: <b>${esc(p.sizes[sel.s][L])}</b></span><div class="qv-szs">${p.sizes.map((z,i)=>`<button class="qv-sz${i===sel.s?' on':''}" type="button" data-qs="${i}" aria-pressed="${i===sel.s}">${esc(z[L])}</button>`).join('')}</div></div>`:'';
  qvInfo.innerHTML=`<h3 id="qv-title">${esc(p.n[L])}</h3><div class="qv-pr"><span>${fmt(p.p)}</span>${p.o?`<s>${fmt(p.o)}</s><span class="qv-off">-${Math.round(100-p.p*100/p.o)}%</span>`:''}</div>${p.o?`<p class="qv-sv">${t('save')} ${fmt(p.o-p.p)}</p>`:''}<p class="qv-ds">${MX.desc[p.c][L]}</p>${col}${siz}<div class="qv-act"><button class="qv-btn" type="button" id="qv-add">${t('add')}</button><button class="qv-btn ghost" type="button" id="qv-wa"><svg class="i"><use href="#wa"/></svg>${t('wa')}</button></div><a class="qv-link" href="#" id="qv-full">${t('full')}</a>`;
  if(focusSel){const f=qvInfo.querySelector(focusSel);f&&f.focus({preventScroll:true})}
}
function openQV(id){
  const p=byId(id);if(!p||p.addon||qOpen)return;
  qid=id;sel={c:0,s:0};idx=0;qOpen=true;lastF=document.activeElement;
  qvX.setAttribute('aria-label',t('close'));
  renderGal();renderInfo();qvEl.hidden=false;lockB();
  requestAnimationFrame(()=>{qvEl.classList.add('on');qvX.focus({preventScroll:true})});
}
function closeQV(noFocus){
  if(!qOpen)return;
  qOpen=false;qvEl.classList.remove('on');
  setTimeout(()=>{qvEl.hidden=true;unlockB();if(!noFocus&&lastF&&lastF.focus)lastF.focus({preventScroll:true})},reduced()?0:300);
}
function quickWa(){
  const p=prod(),L=ix();
  const v=[p.colors?p.colors[sel.c].n[L]:'',p.sizes?p.sizes[sel.s][L]:''].filter(Boolean).join(' · ');
  const sub=p.p,disc=discAmt(sub),ship=codeShip(sub),used=(disc>0||ship)?DISCCODE:'',tot=sub-disc;
  const msg=[t('waTitle')+' — '+t('brand'),`${p.n[L]}${v?` (${v})`:''} × 1 = ${fmt(sub)}`,disc?`${t('disc')}: -${fmt(disc)}`:'',used?`${t('code')}: ${used}`:'',`${t('tot')}: ${fmt(tot)}`,(tot>=FREE||ship)?t('freeShip'):''].filter(Boolean).join('\n');
  window.open('https://wa.me/'+WA+'?text='+encodeURIComponent(msg),'_blank');
  if(used&&window.ElcobyWheel)ElcobyWheel.markUsed(used);
  DISCCODE='';discBad=false;
}
/* أحداث النافذة */
qvEl.addEventListener('click',e=>{
  if(e.target===qvEl){closeQV();return}
  const a=e.target.closest('#qv-full');if(a){e.preventDefault();const id=qid;closeQV(true);setTimeout(()=>openM(id),0);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='qv-x'){closeQV();return}
  if(b.dataset.qn){go(idx+ +b.dataset.qn);return}
  if(b.dataset.qg!==undefined){go(+b.dataset.qg);return}
  if(b.dataset.qc!==undefined){sel.c=+b.dataset.qc;const c=prod().colors[sel.c];if(c&&c.img){idx=0;renderGal()}renderInfo('[data-qc="'+sel.c+'"]');return}
  if(b.dataset.qs!==undefined){sel.s=+b.dataset.qs;renderInfo('[data-qs="'+sel.s+'"]');return}
  if(b.id==='qv-add'){const p=prod(),on=qvMain.querySelector('.qv-sl.on');addToCart(qid,1,p.colors?sel.c:null,p.sizes?sel.s:null);fly(qvMain,on&&on.src);return}
  if(b.id==='qv-wa'){quickWa();return}
});
/* سحب بالإصبع / الماوس بين الصور */
qvMain.addEventListener('pointerdown',e=>{sx0=e.clientX});
qvMain.addEventListener('pointerup',e=>{if(sx0==null)return;const dx=e.clientX-sx0;sx0=null;if(Math.abs(dx)>40)go(idx+(dx<0?1:-1)*(rtl()?-1:1))});
qvMain.addEventListener('pointercancel',()=>{sx0=null});
/* زرار المعاينة على الكارت */
document.addEventListener('click',e=>{const b=e.target.closest('.qv[data-qv]');if(b)openQV(b.dataset.qv)});
/* كيبورد: Esc / أسهم / Tab محبوس جوا النافذة */
document.addEventListener('keydown',e=>{
  if(!qOpen)return;
  if(e.key==='Escape'){closeQV();return}
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){go(idx+(e.key==='ArrowRight'?1:-1)*(rtl()?-1:1));return}
  if(e.key!=='Tab')return;
  const f=[...qvEl.querySelectorAll('button:not([disabled]),a[href]')].filter(el=>el.offsetParent!==null);
  if(!f.length)return;
  const a=f[0],z=f[f.length-1];
  if(e.shiftKey&&(document.activeElement===a||document.activeElement===qvCard)){e.preventDefault();z.focus()}
  else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}
});

/* =====================================================================
   3) Countdown bar — شريط علوي ثابت بعد الفوز بكود من العجلة (وقت حقيقي: الكود بينتهي مع العدّاد)
   ===================================================================== */
const bar=q('#mi-bar'),clock=q('#mi-clock'),msg=q('#mi-msg'),cpy=q('#mi-copy'),CK='elcoby_bar_closed';
let tm=null,goneTm=null;
const wInfo=()=>window.ElcobyWheel&&ElcobyWheel.info&&ElcobyWheel.info();
const getClosed=()=>{try{return sessionStorage.getItem(CK)}catch(e){return null}};
const setClosed=v=>{try{v?sessionStorage.setItem(CK,'1'):sessionStorage.removeItem(CK)}catch(e){}};
const clockTxt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function prizeLabel(code){
  const c=(typeof CODES==='object'&&CODES[code])||null;if(!c)return code;
  return c.t==='pct'?t('pct').replace('{v}',c.v):c.t==='flat'?t('flat').replace('{v}',c.v):t('ship');
}
function setBarH(){document.documentElement.style.setProperty('--bar-h',(bar.classList.contains('on')?bar.offsetHeight:0)+'px')}
if(window.ResizeObserver)new ResizeObserver(setBarH).observe(bar);
addEventListener('resize',setBarH);
function barText(){
  const i=wInfo();if(!i||!i.code)return;
  cpy.textContent=t('copy');q('#mi-x').setAttribute('aria-label',t('close'));
  if(bar.classList.contains('gone')){msg.textContent=t('gone');return}
  msg.innerHTML=`<span aria-hidden="true">🎁</span> ${esc(prizeLabel(i.code))} · ${t('codeWord')} <b>${esc(i.code)}</b> · ${t('expires')}`;
}
function barShow(){
  const i=wInfo();if(!i||!i.code||i.used||Date.now()>=i.deadline)return;
  clearTimeout(goneTm);bar.classList.remove('gone');barText();tick();
  bar.classList.add('on');bar.setAttribute('aria-hidden','false');setBarH();
  clearInterval(tm);tm=setInterval(tick,1000);
}
function barHide(){
  clearInterval(tm);clearTimeout(goneTm);
  bar.classList.remove('on');bar.setAttribute('aria-hidden','true');setBarH();
  setTimeout(setBarH,350);
}
function tick(){
  const i=wInfo();
  if(!i||!i.code||i.used){barHide();return}
  const left=i.deadline-Date.now();
  if(left<=0){clearInterval(tm);bar.classList.add('gone');clock.classList.remove('low');barText();goneTm=setTimeout(barHide,5000);return}
  clock.textContent=clockTxt(left);clock.classList.toggle('low',left<60000);
}
cpy.addEventListener('click',async()=>{
  const i=wInfo();if(!i)return;
  const ok=await copyText(i.code);cpy.textContent=ok?t('copied'):t('copy');
  setTimeout(()=>{cpy.textContent=t('copy')},1600);
});
q('#mi-x').addEventListener('click',()=>{setClosed(true);barHide()});
document.addEventListener('elcoby:wheelwin',()=>{setClosed(false);barShow()});
document.addEventListener('visibilitychange',()=>{if(bar.classList.contains('on'))tick()});
new MutationObserver(barText).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
if(!getClosed())barShow();   /* رجع للصفحة والعرض لسه شغال */
window.MicroInteractions={fly,openQuickView:openQV,closeQuickView:closeQV};
})();
</script>
